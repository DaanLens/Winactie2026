<!DOCTYPE html>
<html lang="nl">
<head>
<title>LENS AI · Scorebord</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet" />
</head>
<body class="dark">
<main class="board"><div class="wrap wrap-wide">
  <img class="logo" src="./logo-wit.svg" alt="LENS AI" />
  <div class="board-grid">
    <div>
      <span class="eyebrow">Live scorebord · <span id="aantal">0 deelnemers</span></span>
      <h1>Wie staat er <span class="accent">bovenaan?</span></h1>
      <p class="small" id="top-leeg">Nog geen scores. Jij kunt de eerste zijn.</p>
      <ol class="top" id="top"></ol>
    </div>
    <aside class="qr-panel">
      <img src="./qr-doe-mee.svg" alt="QR-code naar de winactie" />
      <p>Scan en doe mee →</p>
    </aside>
  </div>
</div></main>
<script type="module" src="/src/scorebord.js"></script>
</body>
</html>
